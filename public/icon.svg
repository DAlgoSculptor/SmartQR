<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  <!-- Background card -->
  <rect width="180" height="180" rx="40" fill="#040508" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  
  <!-- Stylized QR Code finder pattern in center -->
  <g transform="translate(45, 45)">
    <!-- Top Left Finder -->
    <rect x="0" y="0" width="30" height="30" rx="6" fill="url(#gradient)" />
    <rect x="8" y="8" width="14" height="14" rx="3" fill="#040508" />
    <rect x="12" y="12" width="6" height="6" rx="1" fill="url(#gradient)" />
    
    <!-- Top Right Finder -->
    <rect x="60" y="0" width="30" height="30" rx="6" fill="url(#gradient)" />
    <rect x="68" y="8" width="14" height="14" rx="3" fill="#040508" />
    <rect x="72" y="12" width="6" height="6" rx="1" fill="url(#gradient)" />
    
    <!-- Bottom Left Finder -->
    <rect x="0" y="60" width="30" height="30" rx="6" fill="url(#gradient)" />
    <rect x="8" y="68" width="14" height="14" rx="3" fill="#040508" />
    <rect x="12" y="72" width="6" height="6" rx="1" fill="url(#gradient)" />
    
    <!-- Bottom Right smaller data dots -->
    <rect x="60" y="60" width="10" height="10" rx="2" fill="url(#gradient)" />
    <rect x="75" y="60" width="15" height="15" rx="3" fill="url(#gradient)" />
    <rect x="60" y="75" width="15" height="10" rx="2" fill="url(#gradient)" />
    <rect x="80" y="80" width="10" height="10" rx="2" fill="url(#gradient)" />
    
    <!-- Center data dot -->
    <rect x="40" y="40" width="10" height="10" rx="2" fill="url(#gradient)" />
  </g>
</svg>